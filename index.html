<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<meta name="color-scheme" content="dark">
<title>Until We See Each Other Again</title>
<style>
  :root{
    --ink:#fff7e8;
    --gold:#ffd27a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;height:100dvh;overflow:hidden}
  body{
    font-family:"Georgia","Times New Roman",serif;
    color:var(--ink);
    background:linear-gradient(180deg,#0b1030 0%,#2a2a6b 38%,#8a4a7a 66%,#f08a5d 100%);
  }
  #stars{position:absolute;inset:0;width:100%;height:100%}
  .star{animation:tw 3s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}

  .content{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;
    padding:6vh 16px 0;text-align:center;z-index:2;
  }
  h1{
    font-weight:400;font-style:italic;
    font-size:clamp(1.6rem,4.6vw,3.4rem);
    letter-spacing:.02em;
    text-shadow:0 2px 24px rgba(255,200,120,.45);
  }
  .sub{
    margin-top:.6rem;font-size:clamp(.7rem,1.5vw,.95rem);
    letter-spacing:.3em;text-transform:uppercase;color:var(--gold);opacity:.9;
  }
  .timer{
    margin-top:clamp(1rem,4vh,2.2rem);
    display:flex;gap:clamp(.5rem,2vw,1.4rem);flex-wrap:wrap;justify-content:center;
  }
  .box{
    min-width:clamp(68px,13vw,140px);
    padding:clamp(.6rem,2vh,1.1rem) .6rem;
    background:rgba(10,12,40,.45);
    border:1px solid rgba(255,210,122,.4);
    border-radius:18px;
    backdrop-filter:blur(6px);
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  .num{
    font-family:"Segoe UI",system-ui,sans-serif;font-weight:200;
    font-size:clamp(2rem,7vw,4.8rem);line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .lab{
    margin-top:.4rem;font-family:"Segoe UI",system-ui,sans-serif;
    font-size:clamp(.6rem,1.2vw,.8rem);letter-spacing:.25em;text-transform:uppercase;color:var(--gold);
  }
  .target{
    margin-top:1.1rem;font-family:"Segoe UI",system-ui,sans-serif;
    font-size:clamp(.7rem,1.4vw,.9rem);opacity:.75;letter-spacing:.05em;
  }

  #scene{position:absolute;left:0;bottom:0;width:100%;height:58vh;z-index:1}
  .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  .twinkle{animation:win 2.5s steps(1) infinite}
  @keyframes win{0%{opacity:1}40%{opacity:.25}60%{opacity:1}}
  .bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .chew{animation:chew .7s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes chew{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
  .drift{animation:drift 60s linear infinite}
  @keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1800px)}}
  .lantern{animation:rise 14s linear infinite;opacity:0}
  @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.95}85%{opacity:.9}100%{transform:translateY(-420px);opacity:0}}
  .pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%,40%,100%{transform:scale(1)}10%{transform:scale(1.35)}20%{transform:scale(1)}28%{transform:scale(1.25)}}
  .pulse{animation-duration:1.4s}
  .eat{animation:eat 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes eat{0%,100%{transform:translate(0,0) rotate(0)}40%,65%{transform:translate(26px,-12px) rotate(10deg)}}
  .mini{animation:mini 4.5s ease-out infinite;opacity:0}
  @keyframes mini{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:.9}100%{transform:translate(var(--dx),-90px) scale(1);opacity:0}}
  .glow{animation:glow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes glow{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
  .shoot{animation:shoot 9s linear infinite;opacity:0}
  @keyframes shoot{0%{transform:translate(0,0);opacity:0}2%{opacity:1}12%{transform:translate(-320px,170px);opacity:0}100%{transform:translate(-320px,170px);opacity:0}}
  .wave{animation:wave 3s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
  @keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(6deg)}}

  /* ---------- Phone (portrait): left half Chile, right half China ---------- */
  #extra{display:none}
  h1 br{display:none}
  @media (max-aspect-ratio:1/1){
    html{background-color:#0b1030;background-image:linear-gradient(#0b1030 55%,#1d1a3f 55%)}
    body{overscroll-behavior:none}
    body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:24px;background:#1d1a3f;z-index:1;pointer-events:none}
    .content{bottom:auto;height:calc(100vh - 111.5vw);height:calc(100dvh - 111.5vw);justify-content:flex-end;padding-top:env(safe-area-inset-top);padding-bottom:3vh}
    h1{font-size:min(9.8vw,5.6vh,3.4rem);line-height:1.08;max-width:96vw}
    h1 br{display:inline}
    .sub{margin-top:.8rem}
    .timer{width:100%;max-width:440px;gap:2.2vw;flex-wrap:nowrap;margin-top:clamp(.8rem,2.5vh,1.6rem)}
    .box{flex:1;min-width:0;padding:.7rem .2rem;border-radius:14px}
    .num{font-size:min(9.5vw,5.2vh,3rem)}
    .lab{letter-spacing:.12em;font-size:.58rem}
    .target{padding:0 4vw;line-height:1.4;margin-top:.8rem}
    #scene{width:100%;height:auto;aspect-ratio:780/870}
    #route{stroke-width:3.5px;stroke-dasharray:9 14;opacity:.9}
    #plane{scale:1.9}
    #heartg{transform:translate(390px,-120px) scale(2.4) translate(-800px,-142px)}
    #extra{display:block}
    #sky{transform:translateX(-410px)}
    #chile{clip-path:url(#clipL)}
    #cflag{transform:translateX(-372px)}
    #ahu{transform:scaleX(.8)}
    #m1{translate:-20px 0}
    #m2{translate:-45px 0}
    #m3{translate:-68px 0}
    #china{transform:translateX(-560px);clip-path:url(#clipR)}
    #zflag{translate:60px 0}
    #sht{translate:30px 0}
    #panda{translate:-90px 0}
  }
  /* Phone held sideways */
  @media (max-height:520px) and (min-aspect-ratio:1/1){
    .content{padding-top:2vh}
    h1{font-size:1.4rem}
    .sub,.target{display:none}
    .timer{margin-top:.6rem}
    .box{padding:.35rem .5rem;min-width:70px}
    .num{font-size:2rem}
    #scene{height:50vh}
  }

  /* ---------- Shanghai page ---------- */
  .sh-btn{
    position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:14px;z-index:5;
    font:inherit;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--ink);background:rgba(10,12,40,.5);border:1px solid rgba(255,210,122,.55);
    border-radius:999px;padding:.55rem 1.1rem;cursor:pointer;backdrop-filter:blur(6px);
    transition:background .2s,transform .2s;
  }
  .sh-btn:hover{background:rgba(255,210,122,.25);transform:translateY(-1px)}
  #shanghai{
    position:fixed;inset:0;z-index:10;overflow:hidden;background:#07082a;
    opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;
  }
  #shanghai.open{opacity:1;visibility:visible}
  #shbg{position:absolute;inset:0;width:100%;height:100%}
  .sh-back{
    position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:14px;z-index:2;
    font:inherit;font-size:.85rem;letter-spacing:.15em;text-transform:uppercase;
    color:var(--ink);background:rgba(10,12,40,.5);border:1px solid rgba(255,210,122,.45);
    border-radius:999px;padding:.5rem 1rem;cursor:pointer;backdrop-filter:blur(6px);
  }
  .sh-title{
    position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 9vh);z-index:2;text-align:center;
    font-weight:400;font-style:italic;font-size:clamp(2rem,7vw,4.2rem);
    text-shadow:0 2px 28px rgba(255,120,170,.6);pointer-events:none;
  }
  .sh-title small{display:block;margin-top:.4rem;font-style:normal;font-size:clamp(.7rem,1.6vw,1rem);letter-spacing:.4em;color:var(--gold)}
  .days{
    position:absolute;left:50%;bottom:clamp(18px,6vh,60px);transform:translateX(-50%);z-index:2;
    display:grid;grid-template-columns:repeat(6,auto);gap:clamp(.5rem,1.4vw,1rem);
    width:max-content;max-width:94vw;
  }
  .day{
    font:inherit;font-size:clamp(.8rem,1.5vw,1.05rem);letter-spacing:.12em;
    color:var(--ink);background:rgba(10,12,40,.55);border:1px solid rgba(255,210,122,.5);
    border-radius:16px;padding:.9rem clamp(.8rem,2vw,1.6rem);cursor:pointer;backdrop-filter:blur(8px);
    box-shadow:0 8px 26px rgba(0,0,0,.4);transition:background .2s,transform .2s,box-shadow .2s;
  }
  .day:hover,.day:focus-visible{background:rgba(255,122,168,.35);transform:translateY(-3px);box-shadow:0 12px 30px rgba(255,90,150,.35);outline:none}
  @media (max-width:640px){
    .days{grid-template-columns:repeat(3,1fr);width:88vw}
    .day{padding:1rem .4rem}
  }
  .boat{animation:boat 40s linear infinite}
  @keyframes boat{from{transform:translateX(-300px)}to{transform:translateX(1900px)}}
  .shimmer{animation:shimmer 3s ease-in-out infinite}
  @keyframes shimmer{0%,100%{opacity:.15;transform:scaleX(.8)}50%{opacity:.7;transform:scaleX(1.1)}}
  .fw{animation:fw 5s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:center}
  @keyframes fw{0%{transform:scale(.1);opacity:0}8%{opacity:1}60%{opacity:.8}100%{transform:scale(1.4);opacity:0}}
  .beam{animation:beam 6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  @keyframes beam{0%,100%{opacity:.25;transform:rotate(-8deg)}50%{opacity:.6;transform:rotate(8deg)}}
</style>
</head>
<body>
<svg id="stars" aria-hidden="true"></svg>
<button class="sh-btn" id="shBtn" type="button">Shanghai</button>

<div class="content">
  <h1>Until we see each <br>other again</h1>
  <div class="sub">Te amo baobao</div>
  <div class="timer" role="timer" aria-live="off">
    <div class="box"><div class="num" id="d">--</div><div class="lab">Days</div></div>
    <div class="box"><div class="num" id="h">--</div><div class="lab">Hours</div></div>
    <div class="box"><div class="num" id="m">--</div><div class="lab">Minutes</div></div>
    <div class="box"><div class="num" id="s">--</div><div class="lab">Seconds</div></div>
  </div>
  <div class="target">Friday, January 22, 2027 · 4:25 PM China time</div>
</div>

<svg id="scene" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b4a8c"/><stop offset="1" stop-color="#2c2559"/>
    </linearGradient>
    <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5a9a"/><stop offset="1" stop-color="#3b2f6b"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a6a"/><stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffe3a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffe3a0" stop-opacity="0"/></radialGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff0b8"/><stop offset="1" stop-color="#ffb35a"/></radialGradient>
    <linearGradient id="seamg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0"/><stop offset=".5" stop-color="#ffd27a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd27a" stop-opacity=".2"/>
    </linearGradient>
    <clipPath id="clipL"><rect x="0" y="-100" width="390" height="900"/></clipPath>
    <clipPath id="clipR"><rect x="950" y="-100" width="400" height="900"/></clipPath>
  </defs>

  <g id="pan">
  <g id="sky">
  <!-- setting sun in the middle -->
  <circle class="glow" cx="800" cy="470" r="170" fill="url(#glow)"/>
  <circle cx="800" cy="470" r="62" fill="url(#sun)"/>

  <!-- drifting clouds -->
  <g class="drift" opacity=".35" fill="#ffd9c0">
    <ellipse cx="0" cy="120" rx="90" ry="16"/><ellipse cx="40" cy="108" rx="50" ry="14"/>
  </g>
  <g class="drift" style="animation-duration:90s;animation-delay:-40s" opacity=".25" fill="#ffd9c0">
    <ellipse cx="0" cy="210" rx="120" ry="18"/><ellipse cx="50" cy="198" rx="60" ry="14"/>
  </g>

  </g>

  <!-- flight path: Chile -> China -->
  <path id="route" d="M 330 330 Q 800 40 1270 330" fill="none" stroke="#ffd27a" stroke-width="2" stroke-dasharray="4 10" opacity=".7"/>
  <g id="plane">
    <path d="M-14 0 L14 0 L6 -4 L-4 -4 Z" fill="#fff"/>
    <path d="M-4 0 L-14 10 L-8 10 L4 0Z M-4 0 L-14 -10 L-8 -10 L4 0Z" fill="#fff" opacity=".9"/>
    <animateMotion dur="14s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion>
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.06;.94;1"/>
  </g>
  <g id="heartg">
  <!-- pulsing heart at the apex -->
  <g transform="translate(0,-30)"><path class="pulse" d="M800 150 C 780 125, 750 150, 800 190 C 850 150, 820 125, 800 150Z" fill="#ff6b81"/></g>

  <g fill="#ff6b81">
    <path class="mini" style="--dx:-30px;animation-delay:0s" d="M800 120 c-6 -8 -16 0 0 14 c16 -14 6 -22 0 -14z"/>
    <path class="mini" style="--dx:25px;animation-delay:-1.5s" d="M800 120 c-6 -8 -16 0 0 14 c16 -14 6 -22 0 -14z"/>
    <path class="mini" style="--dx:0px;animation-delay:-3s" d="M800 120 c-6 -8 -16 0 0 14 c16 -14 6 -22 0 -14z"/>
  </g>

  </g>

  <g id="chile">
  <!-- ================= CHILE (left) ================= -->
  <!-- far Andes -->
  <polygon points="0,420 90,300 160,360 260,230 350,340 430,280 520,380 620,300 720,400 800,430 800,600 0,600" fill="url(#mtn)"/>
  <g fill="#fff" opacity=".95">
    <polygon points="260,230 206,300 225,285 240,306 258,288 275,309 292,290 317,300"/>
    <polygon points="90,300 56,345 72,332 88,350 104,334 122,348 142,345"/>
    <polygon points="430,280 350,340 375,325 392,346 410,326 428,351 448,328 468,346 484,340"/>
    <polygon points="620,300 558,350 578,338 594,357 610,340 626,359 644,340 660,352 670,350"/>
  </g>
  <g fill="#e9e4ff" opacity=".55">
    <polygon points="260,230 280,262 262,282 275,309 292,290 317,300 300,270"/>
    <polygon points="430,280 448,328 468,346 484,340 462,306"/>
    <polygon points="620,300 640,335 660,352 670,350 646,318"/>
  </g>
  <!-- Patagonia lake -->
  <path d="M0 520 Q 200 505 420 520 T 800 520 L800 600 L0 600Z" fill="#2c3f7a" opacity=".85"/>
  <path d="M60 545 h110 M240 560 h140 M450 548 h120" stroke="#ffd9a0" stroke-width="2" opacity=".5" stroke-linecap="round"/>
  <!-- foreground hill -->
  <path d="M0 560 Q 160 500 340 545 T 700 550 L800 560 L800 600 L0 600Z" fill="#1d1a3f"/>

  <!-- Easter Island moai on an ahu platform -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3160"/><stop offset=".6" stop-color="#6c5b92"/><stop offset="1" stop-color="#9a80b0"/>
    </linearGradient>
    <g id="moai">
      <!-- torso -->
      <path d="M-21 0 L-23 -46 Q-23 -54 -14 -54 L14 -54 Q23 -54 23 -46 L21 0Z" fill="url(#stone)"/>
      <!-- arms and hands -->
      <path d="M-23 -44 Q-24 -24 -10 -16 M23 -44 Q24 -24 10 -16" stroke="#1f1840" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M-11 -17 L11 -17 M-9 -13 L9 -13" stroke="#1f1840" stroke-width="2" stroke-linecap="round"/>
      <path d="M-10 -17 l3 -5 M-4 -17 l1 -6 M4 -17 l-1 -6 M10 -17 l-3 -5" stroke="#1f1840" stroke-width="1.4" stroke-linecap="round"/>
      <!-- ears -->
      <rect x="-27" y="-108" width="7" height="34" rx="3" fill="url(#stone)"/>
      <rect x="20" y="-108" width="7" height="34" rx="3" fill="url(#stone)"/>
      <!-- head -->
      <path d="M-19 -52 L-21 -118 Q-21 -134 -9 -134 L9 -134 Q21 -134 21 -118 L19 -52 Q10 -46 0 -46 Q-10 -46 -19 -52Z" fill="url(#stone)"/>
      <!-- heavy brow and eye sockets -->
      <path d="M-21 -108 Q0 -116 21 -108 L21 -101 Q0 -108 -21 -101Z" fill="#1f1840" opacity=".75"/>
      <ellipse cx="-10" cy="-99" rx="5" ry="3.5" fill="#150f35"/><ellipse cx="10" cy="-99" rx="5" ry="3.5" fill="#150f35"/>
      <!-- long nose -->
      <path d="M-4 -106 L-5 -76 Q0 -70 5 -76 L4 -106Z" fill="#8d79b3" opacity=".85"/>
      <path d="M-5 -76 Q0 -70 5 -76" stroke="#1f1840" stroke-width="2" fill="none"/>
      <path d="M-3 -79 l0 3 M3 -79 l0 3" stroke="#150f35" stroke-width="1.6"/>
      <!-- thin lips and strong chin -->
      <path d="M-11 -64 Q0 -60 11 -64" stroke="#150f35" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M-12 -57 Q0 -52 12 -57" stroke="#1f1840" stroke-width="1.6" fill="none" opacity=".7"/>
      <!-- cheek shadows -->
      <path d="M-18 -94 Q-13 -74 -11 -66 M18 -94 Q13 -74 11 -66" stroke="#1f1840" stroke-width="1.5" fill="none" opacity=".5"/>
    </g>
  </defs>
  <!-- ahu stone platform -->
  <g id="ahu">
    <path d="M30 592 L50 556 L350 556 L370 592Z" fill="#2a2352"/>
    <g stroke="#1a1440" stroke-width="2" fill="none">
      <path d="M44 568 H356 M38 580 H362"/>
      <path d="M90 556 v12 M160 556 v12 M230 556 v12 M300 556 v12 M65 568 v12 M125 568 v12 M195 568 v12 M265 568 v12 M335 568 v12 M95 580 v12 M165 580 v12 M235 580 v12 M305 580 v12"/>
    </g>
  </g>
  <use id="m1" href="#moai" transform="translate(105,558) scale(1.05)"/>
  <use id="m2" href="#moai" transform="translate(205,558) scale(1.2)"/>
  <use id="m3" href="#moai" transform="translate(300,558) scale(.95)"/>
  <!-- grass tufts -->
  <g stroke="#4f8f64" stroke-width="2" stroke-linecap="round">
    <path d="M20 575 l-3 -12 M24 575 l2 -14 M28 575 l5 -10 M372 580 l-3 -12 M377 580 l2 -14 M382 580 l5 -10"/>
  </g>
  <!-- Chilean flag -->
  <g id="cflag">
  <rect x="660" y="450" width="3" height="110" fill="#cfc7ee"/>
  <g class="wave">
    <rect x="663" y="452" width="62" height="20" fill="#fff"/>
    <rect x="663" y="472" width="62" height="20" fill="#d52b1e"/>
    <rect x="663" y="452" width="22" height="20" fill="#0039a6"/>
    <polygon points="674,455 676,462 683,462 677,466 679,471 674,467 669,471 671,466 665,462 672,462" fill="#fff" transform="scale(.9) translate(75,50)"/>
  </g>
  </g>
  <!-- condor -->
  <g class="drift" style="animation-duration:38s;animation-delay:-8s">
    <g transform="translate(0,260)">
      <path d="M-26 4 Q-13 -14 0 0 Q13 -14 26 4 Q13 -4 0 6 Q-13 -4 -26 4Z" fill="#150f35">
        <animate attributeName="d" dur="1.8s" repeatCount="indefinite"
          values="M-26 4 Q-13 -14 0 0 Q13 -14 26 4 Q13 -4 0 6 Q-13 -4 -26 4Z;M-26 -6 Q-13 6 0 2 Q13 6 26 -6 Q13 8 0 8 Q-13 8 -26 -6Z;M-26 4 Q-13 -14 0 0 Q13 -14 26 4 Q13 -4 0 6 Q-13 -4 -26 4Z"/>
      </path>
    </g>
  </g>

  </g>

  <g id="china">
  <!-- ================= CHINA (right) ================= -->
  <!-- far hills / karst -->
  <path d="M800 430 Q 880 380 940 410 Q 1000 330 1070 400 Q 1130 360 1200 410 Q 1260 350 1340 400 Q 1450 340 1600 420 L1600 600 L800 600Z" fill="url(#mtn)" opacity=".8"/>
  <!-- skyline -->
  <g fill="url(#city)">
    <rect x="860" y="400" width="42" height="200"/><rect x="910" y="370" width="36" height="230"/>
    <rect x="1000" y="410" width="50" height="190"/><rect x="1180" y="380" width="44" height="220"/>
    <rect x="1240" y="420" width="55" height="180"/><rect x="1330" y="390" width="40" height="210"/>
    <rect x="1440" y="410" width="60" height="190"/><rect x="1520" y="380" width="50" height="220"/>
  </g>
  <!-- Shanghai Tower (twisting) -->
  <g id="sht">
  <path d="M1060 600 L1070 330 Q1085 250 1095 175 Q1105 250 1118 330 L1130 600Z" fill="#4a3a86"/>
  <path d="M1095 175 L1095 130" stroke="#cfc7ee" stroke-width="3"/>

<script>
(function(){
  // Target: Jan 22, 2027 4:25 PM China (UTC+8) = 08:25:00 UTC = 5:25 AM Chile (UTC-3)
  var TARGET = Date.UTC(2027, 0, 22, 8, 25, 0);

  var el = {d:d, h:h, m:m, s:s};
  function pad(n){ return String(n).padStart(2, "0"); }
  function tick(){
    var diff = Math.max(0, TARGET - Date.now());
    var t = Math.floor(diff / 1000);
    el.d.textContent = Math.floor(t / 86400);
    el.h.textContent = pad(Math.floor(t % 86400 / 3600));
    el.m.textContent = pad(Math.floor(t % 3600 / 60));
    el.s.textContent = pad(t % 60);
  }
  tick(); setInterval(tick, 250);

  // phone portrait: Chile on the left half, China on the right half
  var scene = document.getElementById("scene"), route = document.getElementById("route"),
      mq = window.matchMedia("(max-aspect-ratio: 1/1)");
  function fit(){
    scene.setAttribute("viewBox", mq.matches ? "0 -230 780 870" : "0 0 1600 600");
    scene.setAttribute("preserveAspectRatio", mq.matches ? "xMidYMax meet" : "xMidYMax slice");
    route.setAttribute("d", mq.matches ? "M 60 225 Q 390 -300 720 225" : "M 330 330 Q 800 40 1270 330");
  }
  fit();
  if (mq.addEventListener) mq.addEventListener("change", fit); else mq.addListener(fit);

  // Shanghai overlay
  var sh2 = document.getElementById("shanghai"), shNS = "http://www.w3.org/2000/svg";
  function mk(tag, attrs, parent){
    var e = document.createElementNS(shNS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e); return e;
  }
  var gs = document.getElementById("shstars");
  for (var a = 0; a < 110; a++){
    var st = mk("circle", {cx:(Math.random()*1600).toFixed(0), cy:(Math.random()*420).toFixed(0), r:(Math.random()*1.4+.4).toFixed(2), fill:"#fff", "class":"star"}, gs);
    st.style.animationDelay = (-Math.random()*3).toFixed(2) + "s";
  }
  var gw = document.getElementById("shwin");
  [[320,560,64,210],[396,520,50,250],[820,580,70,190],[900,540,52,230],[1090,570,60,200],[1160,610,80,160],
   [1290,540,56,230],[1360,590,70,180],[0,600,90,170],[100,570,60,200],[190,620,100,150],
   [480,420,80,340],[626,320,28,440],[708,380,62,380]].forEach(function(b){
    for (var n = 0; n < b[2]*b[3]/700; n++){
      var w = mk("rect", {x:(b[0]+6+Math.random()*(b[2]-16)).toFixed(0), y:(b[1]+8+Math.random()*(b[3]-24)).toFixed(0), width:4, height:6,
        fill: Math.random() < .2 ? "#ff9ec0" : "#ffd27a", "class":"twinkle"}, gw);
      w.style.animationDelay = (-Math.random()*3).toFixed(2) + "s";
      w.style.animationDuration = (2 + Math.random()*5).toFixed(1) + "s";
    }
  });
  var gr = document.getElementById("shrefl");
  for (var r = 0; r < 28; r++){
    var rf = mk("rect", {x:(Math.random()*1560).toFixed(0), y:(780 + Math.random()*85).toFixed(0), width:(20+Math.random()*60).toFixed(0), height:3, rx:1.5,
      fill:["#ffd27a","#ff7aa8","#9ad7ff"][r % 3], "class":"shimmer"}, gr);
    rf.style.animationDelay = (-Math.random()*3).toFixed(2) + "s";
    rf.style.transformBox = "fill-box"; rf.style.transformOrigin = "center";
  }
  function setShanghai(open){
    sh2.classList.toggle("open", open);
    sh2.setAttribute("aria-hidden", open ? "false" : "true");
    document.getElementById(open ? "shBack" : "shBtn").focus();
  }
  document.getElementById("shBtn").addEventListener("click", function(){ setShanghai(true); });
  document.getElementById("shBack").addEventListener("click", function(){ setShanghai(false); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && sh2.classList.contains("open")) setShanghai(false); });

  // shooting star
  var sh = document.createElementNS("http://www.w3.org/2000/svg", "line");
  sh.setAttribute("x1","85%"); sh.setAttribute("y1","8%"); sh.setAttribute("x2","86.5%"); sh.setAttribute("y2","9%");
  sh.setAttribute("stroke","#fff"); sh.setAttribute("stroke-width","2"); sh.setAttribute("stroke-linecap","round");
  sh.setAttribute("class","shoot"); document.getElementById("stars").appendChild(sh);
  // stars
  var svg = document.getElementById("stars"), NS = "http://www.w3.org/2000/svg";
  for (var i = 0; i < 90; i++){
    var c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", (Math.random()*100) + "%");
    c.setAttribute("cy", (Math.random()*55) + "%");
    c.setAttribute("r", (Math.random()*1.4 + .4).toFixed(2));
    c.setAttribute("fill", "#fff");
    c.setAttribute("class", "star");
    c.style.animationDelay = (-Math.random()*3).toFixed(2) + "s";
    c.style.animationDuration = (2 + Math.random()*3).toFixed(2) + "s";
    svg.appendChild(c);
  }
})();
</script>
